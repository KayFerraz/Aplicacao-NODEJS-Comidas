<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <title>Paes</title>
</head>
<body>
    <h1>Cadastro de Confeitaria</h1>
    <form action="/" method="GET">
  <div class="form-group">
    <label for="formGroupExampleInput">Nome</label>
    <input type="text" class="form-control" id="formGroupExampleInput" placeholder="Nome do doce">
  </div>
  <div class="form-group">
    <label for="formGroupExampleInput2">Tipo de doce</label>
    <input type="text" class="form-control" id="formGroupExampleInput2" placeholder="Tipo">
  </div>
    <select class="custom-select custom-select-lg mb-3">
    <option selected>Selecione o tipo de doce</option>
    <option value="1">Bolos</option>
    <option value="2">Doce fino</option>
    <option value="3">Cookies</option>
    </select>
    <div class="form-group">
    <label for="formGroupExampleInput2">Ingredientes</label>
    <input type="text" class="form-control" id="formGroupExampleInput2" placeholder="Lista de ingredientes">
  </div>
  <div class="form-group">
    <label for="formGroupExampleInput2">Preço (kg)</label>
    <input type="text" class="form-control" id="formGroupExampleInput2" placeholder=" R$00,00">
  </div>
     <button class="btn btn-primary" type="button" >
            Cadastrar
        </button>
</form>
</body>
</html>
