<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <title>Salgados</title>
</head>
<body>
    <h1>Cadastro de Salgados</h1>
    <form action="/" method="GET">
  <div class="form-group">
    <label for="formGroupExampleInput">Nome</label>
    <input type="text" class="form-control" name="nomeSalgado" id="formGroupExampleInput" placeholder="Nome do salgado">
  </div>
    <select class="custom-select custom-select-lg mb-3" name="tipoSalgado">
    <option selected>Selecione o tipo de salgado</option>
    <option value="1">Frito</option>
    <option value="2">Assado</option>
    <option value="3">Lanche natural</option>
    </select>
    <div class="form-group">
    <label for="formGroupExampleInput2">Ingredientes</label>
    <input type="text" class="form-control" id="formGroupExampleInput2" name="ingrSalgado" placeholder="Lista de ingredientes">
  </div>
  <div class="form-group">
    <label for="formGroupExampleInput2">Preço (unidade)</label>
    <input type="text" class="form-control" name="valor" id="formGroupExampleInput2" placeholder=" R$00,00">
  </div>
     <button class="btn btn-primary" type="submit" >
            Cadastrar
        </button>
</form>
</body>
</html>
